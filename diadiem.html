<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tìm Địa Điểm Gần Đây - Ecocycle</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/diadiem.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
	 <link rel="stylesheet" href="css/chatbot.css">
</head>
<body>

    <!-- ==================== HEADER PLACEHOLDER ==================== -->
    <div id="header-placeholder"></div>

    <main>
        <!-- ==================== HERO SECTION ==================== -->
        <section class="hero-locations">
            <div class="container">

                <a href="#search-section" class="btn">Bắt đầu tìm kiếm <i class="fa-solid fa-arrow-down"></i></a>
            </div>
        </section>

        <!-- ==================== SEARCH & FILTER BLOCK ==================== -->
        <section id="search-section" class="search-filter-section">
            <div class="container">
                <div class="main-search-bar">
                    <i class="fa-solid fa-map-location-dot"></i>
                    <input type="text" id="address-input" placeholder="Nhập địa chỉ, thành phố, hoặc quận/huyện của bạn...">
                    <button id="gps-button" class="btn-gps"><i class="fa-solid fa-location-crosshairs"></i> Tìm gần tôi</button>
                </div>
                <div class="advanced-filters">
                    <div class="filter-group">
                        <label for="scrap-type-filter">Loại phế liệu:</label>
                        <select id="scrap-type-filter">
                            <option value="all">Tất cả</option>
                            <option value="metal">Kim loại</option>
                            <option value="paper">Giấy, Carton</option>
                            <option value="plastic">Nhựa, Chai lọ</option>
                            <option value="electronics">Đồ điện tử</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="distance-filter">Khoảng cách:</label>
                        <select id="distance-filter">
                            <option value="1">1 km</option>
                            <option value="3">3 km</option>
                            <option value="5" selected>5 km</option>
                            <option value="10">10 km</option>
                            <option value="9999">Toàn bộ</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="sort-filter">Sắp xếp:</label>
                        <select id="sort-filter">
                            <option value="distance">Gần nhất</option>
                            <option value="rating">Xếp hạng cao nhất</option>
                        </select>
                    </div>
                </div>
            </div>
        </section>



<section class="results-section">
    <div class="map-results-wrapper">
        <!-- Bản đồ tương tác (giữ nguyên) -->
        <div id="map-container"></div>

        <!-- Panel bên phải - Bảng tin giao dịch -->
        <div class="side-panel">
            <div class="panel-header">
                <h3>Giao dịch tại Hà Nội</h3>
                <p>Ưu tiên người bán có số lượng lớn</p>
            </div>
            <div id="trading-board-list" class="panel-content">
                <!-- Danh sách người bán/khách hàng sẽ được JS chèn vào đây -->
            </div>
        </div>
    </div>
</section>
    </main>
<!-- ==================== CHATBOT ==================== -->
<button id="chatbot-toggle-btn" class="chatbot-toggler">
    <img src="images/chatbot.png" alt="Chatbot Icon">
</button>

<div class="chatbot">
    <div class="chat-header">
        <h2>Ecocycle Bot</h2>
        <span class="close-btn"><i class="fa-solid fa-xmark"></i></span>
    </div>
    <ul class="chatbox">
        <li class="chat incoming">
            <p>Xin chào! 👋<br>Tôi có thể giúp gì cho bạn?</p>
        </li>
    </ul>
    <div class="chat-input">
        <textarea placeholder="Nhập tin nhắn..." required></textarea>
        <span id="send-btn"><i class="fa-solid fa-paper-plane"></i></span>
    </div>
</div>
    <!-- ==================== FOOTER PLACEHOLDER ==================== -->
    <div id="footer-placeholder"></div>

    <!-- JavaScript chung cho toàn trang -->
    <script src="js/templates.js"></script>
    <script src="js/script.js"></script>
    
    <!-- THƯ VIỆN BẢN ĐỒ LEAFLET.JS (BẮT BUỘC) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
     
    <!-- JavaScript dành riêng cho bản đồ và tìm kiếm -->
    <script src="js/map.js"></script>
	<script src="js/chatbot.js"></script>	

</body>

        </ul>
    </nav>
</html>
